<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Profile README Preview</title>
  <!-- GitHub Markdown CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css" />
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      margin: 0;
      padding: 0;
    }
    .header-bar {
      background-color: #161b22;
      border-bottom: 1px stroke #30363d;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-title {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-status {
      font-size: 12px;
      color: #8b949e;
      background: #21262d;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid #30363d;
    }
    .preview-container {
      max-width: 888px;
      margin: 40px auto;
      padding: 0 24px 80px 24px;
    }
    .github-border {
      border: 1px solid #30363d;
      border-radius: 6px;
      background-color: #0d1117;
      padding: 32px;
    }
    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      margin: 0 auto;
    }
    /* Customize GitHub Markdown body to match dark mode page */
    .markdown-body {
      --color-canvas-default: #0d1117;
      --color-fg-default: #c9d1d9;
      background-color: #0d1117 !important;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="header-title">
      <i class="fab fa-github" style="font-size: 20px;"></i>
      <span>GitHub Profile README Live Preview</span>
    </div>
    <div class="header-status">
      <span>Dakshinya MohanRaj</span>
    </div>
  </div>

  <div class="preview-container">
    <div class="github-border">
      <article class="markdown-body" id="preview-content">
        <p>Loading README preview...</p>
      </article>
    </div>
  </div>

  <!-- Marked Markdown Parser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
  <script>
    // Fetch and render README.md
    fetch('README.md')
      .then(response => {
        if (!response.ok) {
          throw new Error('Failed to load README.md');
        }
        return response.text();
      })
      .then(markdown => {
        // Configure marked options
        marked.setOptions({
          gfm: true,
          breaks: true,
          headerIds: true,
          mangle: false
        });
        
        // Parse markdown and inject into preview container
        document.getElementById('preview-content').innerHTML = marked.parse(markdown);
      })
      .catch(error => {
        document.getElementById('preview-content').innerHTML = `
          <div style="color: #f85149; padding: 20px; text-align: center;">
            <h3>Error Loading Preview</h3>
            <p>${error.message}</p>
            <p>Please ensure you are viewing this page through a local web server.</p>
          </div>
        `;
        console.error(error);
      });
  </script>
</body>
</html>
